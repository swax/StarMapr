[project]
name = "starmapr"
version = "1.0.0"
description = "Actor face recognition and detection using DeepFace with ArcFace"
requires-python = ">=3.10"
dependencies = [
    "deepface",
    "fastapi",
    "numpy",
    "opencv-python",
    "scikit-learn",
    "google-images-search",
    "python-dotenv",
    "yt-dlp[default]>=2026.8.19",
    "tf-keras",
    "uvicorn[standard]",
    "windows-curses; sys_platform == 'win32'",
    "bgutil-ytdlp-pot-provider==2.0.0",
]

[project.optional-dependencies]
aws = ["boto3[crt]>=1.41,<2"]
